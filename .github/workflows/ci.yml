# Ordinary repository CI: this executes PR-controlled package scripts and is not a MergeVow PR
# Drift Gate or a hostile-code isolation boundary.
name: Repository CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium And Linux Dependencies
        if: runner.os == 'Linux'
        run: pnpm browser:install:ci

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm exec playwright install --only-shell chromium

      - name: Check preparation and code
        run: pnpm check
